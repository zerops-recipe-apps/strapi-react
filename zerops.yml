# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/zerops-yaml-json-schema.json
#
# Strapi CMS at repo root. Setups: `prod` and `dev` only.
# Strapi 5.x requires Node <= 22 — use `nodejs@22` on the Zerops service.

zerops:
  - setup: prod
    build:
      base: nodejs@22
      envVariables:
        STRAPI_URL: ${API_URL}
      buildCommands:
        - yarn
        - yarn build
      deployFiles:
        - config/~
        - src/~
        - build/~
        - public/~
        - database/~
        - package.json
        - favicon.png
        - ~node_modules
      cache:
        - node_modules
    deploy:
      readinessCheck:
        httpGet:
          port: 1337
          path: /_health
    run:
      base: nodejs@22
      envVariables:
        HOST: 0.0.0.0
        PORT: "1337"
        DATABASE_CLIENT: postgres
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:5432/${db_hostname}?sslmode=disable
        APP_KEYS: ${APP_KEYS}
        API_TOKEN_SALT: ${API_TOKEN_SALT}
        ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
        TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
        JWT_SECRET: ${JWT_SECRET}
        API_URL: ${API_URL}
        APP_URL: ${APP_URL}
        DEV_APP_URL: ${DEV_APP_URL}
        ADMIN_EMAIL: ${ADMIN_EMAIL}
        ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      initCommands:
        - zsc execOnce strapi_admin_v1 -- yarn strapi admin:create-user --email=${ADMIN_EMAIL} --password=${ADMIN_PASSWORD} --firstname=Admin --lastname=User
      ports:
        - port: 1337
          httpSupport: true
      start: yarn start
      healthCheck:
        httpGet:
          port: 1337
          path: /_health

  - setup: dev
    build:
      base: nodejs@22
      envVariables:
        STRAPI_URL: ${DEV_API_URL}
      buildCommands:
        - yarn
      deployFiles: ./
      cache:
        - node_modules
    run:
      base: nodejs@22
      envVariables:
        HOST: 0.0.0.0
        PORT: "1337"
        DATABASE_CLIENT: postgres
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:5432/${db_hostname}?sslmode=disable
        APP_KEYS: ${APP_KEYS}
        API_TOKEN_SALT: ${API_TOKEN_SALT}
        ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
        TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
        JWT_SECRET: ${JWT_SECRET}
        API_URL: ${DEV_API_URL}
        APP_URL: ${DEV_APP_URL}
        DEV_APP_URL: ${DEV_APP_URL}
        DEV_API_URL: ${DEV_API_URL}
      ports:
        - port: 1337
          httpSupport: true
      start: zsc noop --silent
